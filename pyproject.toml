[project]
name = "pingme"
version = "0.1.0"
description = "Measure, plot and log the quality of the current internet connection from the terminal."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "plotext>=5.3,<6",
    "httpx>=0.27",
    "numpy>=2",
    "plotly>=5.24",
]

[project.scripts]
pingme = "pingme.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pingme"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# embeds CSS and JS as strings; line length there is not Python style
"src/pingme/render_web.py" = ["E501"]
